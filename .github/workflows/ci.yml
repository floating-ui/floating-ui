name: Tests
on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_call:

jobs:
  checks:
    name: Linting and type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/typescript

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/unit

  functional-tests:
    name: Functional tests
    runs-on: ubuntu-24.04 # Playwright 1.50 does not support ubuntu26.04-x64 yet
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/functional

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-24.04 # Playwright 1.50 does not support ubuntu26.04-x64 yet
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx playwright install --with-deps chromium
      - name: Run browser tests for @floating-ui/react
        run: pnpm --filter @floating-ui/react run test:browser
      - name: Run browser tests for @floating-ui/dom
        run: pnpm --filter @floating-ui/dom run test:browser

  canary-publish:
    name: Publish canary packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/canary-publish
